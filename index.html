<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stencil Lab</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stencil Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4A2A9A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html,body{overscroll-behavior:none}</style>
<style>
/* Layout: workbench — the stencil sits on a cutting-mat stage, controls in a narrow side rail (stacks below on phones) */
:root{
  --paper:#F3F1F6; --surface:#FFFFFF; --ink:#1C1724; --muted:#6A6377; --rule:#DCD6E4;
  --violet:#4A2A9A; --violet-soft:#ECE6F8; --on-violet:#FFFFFF;
  --stage:#E4E0EA; --grid:rgba(74,42,154,.10);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131018; --surface:#1C1823; --ink:#ECE8F2; --muted:#9D95AB; --rule:#302A3A;
  --violet:#A68CF2; --violet-soft:#2A2240; --on-violet:#140F1F;
  --stage:#0E0C12; --grid:rgba(166,140,242,.09); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131018; --surface:#1C1823; --ink:#ECE8F2; --muted:#9D95AB; --rule:#302A3A;
  --violet:#A68CF2; --violet-soft:#2A2240; --on-violet:#140F1F;
  --stage:#0E0C12; --grid:rgba(166,140,242,.09); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--violet)}
.tag{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px/1 var(--body);border:1px solid var(--rule);background:var(--surface);color:var(--ink);
  padding:11px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--violet)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:40px}
.filebtn:focus-within{outline:2px solid var(--violet);outline-offset:2px}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.btn:focus-visible,button:focus-visible,input:focus-visible+.sw,input[type=range]:focus-visible{outline:2px solid var(--violet);outline-offset:2px}

.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:860px){.work{grid-template-columns:minmax(0,1fr)}}

.stagewrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stage{position:relative;border-radius:14px;background-color:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;display:grid;place-items:center;padding:20px;min-height:320px;overflow:hidden}
.stage canvas{display:block;max-width:100%;max-height:min(74vh,920px);width:auto;height:auto;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 28px rgba(20,10,40,.18)}
.stage.drag{outline:2px dashed var(--violet);outline-offset:-8px}
.badge{position:absolute;top:12px;left:12px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  background:var(--violet);color:var(--on-violet);padding:6px 8px;border-radius:6px}
.busy{position:absolute;top:12px;right:12px;font:500 11px/1 var(--mono);letter-spacing:.06em;color:var(--muted);
  background:var(--surface);padding:6px 8px;border-radius:6px;border:1px solid var(--rule)}
.pastebox{border:1.5px dashed var(--violet);border-radius:12px;background:var(--violet-soft);color:var(--violet);padding:14px 16px;min-height:52px;font-weight:500;caret-color:transparent;overflow:hidden;max-height:80px}
.pastebox:empty::before{content:attr(data-ph);color:var(--violet)}
.pastebox:focus{outline:2px solid var(--violet);outline-offset:2px}
.meta{margin:0;color:var(--muted);font:12px/1.4 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:3px;gap:2px}
.seg button{font:500 13px/1 var(--body);border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--violet-soft);color:var(--violet);font-weight:600}
.seg.full{display:flex}.seg.full button{flex:1 1 0}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;display:flex;flex-direction:column;min-width:0}
.group{padding:16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule)}
.group:first-child,.toolnav+.group{border-top:0}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--violet);display:flex;align-items:center;gap:8px}
h2::before{content:"";width:6px;height:18px;border-radius:2px;background:var(--violet)}
.group{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 64px)}
/* barra do topo: idioma + tela */
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--violet);color:var(--on-violet);border-radius:14px;padding:12px 14px}
.topbar .opt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.topbar .olab{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.tseg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:3px}
.tseg button{font:600 15px/1 var(--body);border:0;background:transparent;color:inherit;padding:10px 14px;border-radius:8px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:7px}
.tseg button[aria-pressed="true"]{background:var(--surface);color:var(--violet)}
.tseg svg{width:18px;height:18px;flex:none}
/* atalhos das ferramentas */
.toolnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--surface);border-bottom:2px solid var(--violet);border-radius:14px 14px 0 0;scrollbar-width:none}
.toolnav::-webkit-scrollbar{display:none}
.toolnav button{font:700 13px/1 var(--body);letter-spacing:.02em;border:1.5px solid var(--violet);background:var(--violet-soft);color:var(--violet);padding:10px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px;flex:none}
.toolnav button:hover,.toolnav button.on{background:var(--violet);color:var(--on-violet)}
.panel{overflow:visible}
body:not(.phone) .toolnav{flex-wrap:wrap;overflow:visible}
@media (min-width:861px){body:not(.phone) .stagewrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
  body:not(.phone) .stage canvas{max-height:calc(100vh - 220px)}}
/* aviso de escolha automática */
.tseg button{position:relative}
.tseg button.auto::after{content:"AUTO";position:absolute;top:-7px;right:-4px;font:700 9px/1 var(--mono);letter-spacing:.06em;background:#FFD54A;color:#1C1724;padding:3px 4px;border-radius:4px}
.welcome{position:relative;background:var(--surface);border:2px solid var(--violet);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.welcome::before{content:"";position:absolute;top:-9px;left:40px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--violet);border-top:2px solid var(--violet);transform:rotate(45deg)}
.welcome strong{font-family:var(--display);font-size:22px;text-transform:uppercase;color:var(--violet);line-height:1}
.welcome p{margin:0;font-size:14px}
.welcome ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.welcome .btn{align-self:flex-start}
html.phone .welcome{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 66px);z-index:30;box-shadow:0 12px 40px rgba(20,10,40,.35)}
html.phone .welcome::before{left:auto;right:28%}
/* modo celular: tela cheia estilo app de foto — imagem ocupa tudo, ferramentas em abas embaixo */
.short{display:none}
.toolnav .ti{display:none}
.holdhint{display:none}
.stage canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html.phone,html.phone body{height:100%;overflow:hidden}
html.phone body{display:flex;flex-direction:column;padding-block:6px}
html.phone .app{flex:1;min-height:0;width:100%;max-width:none;gap:8px}
html.phone .topbar{flex-wrap:nowrap;gap:8px;padding:6px;border-radius:12px}
html.phone .topbar .olab{display:none}
html.phone .tseg button{padding:8px 10px;min-height:36px;font-size:13px}
html.phone .long,html.phone #modeSeg span{display:none}
html.phone .short{display:inline}
html.phone header.top{flex-wrap:nowrap;align-items:center}
html.phone h1{font-size:22px;white-space:nowrap}
html.phone header.top{justify-content:space-between;gap:8px}
html.phone .tag{display:none}
html.phone header.top .actions{flex-wrap:nowrap;gap:6px}
html.phone header.top .btn{padding:9px 12px;font-size:13px;min-height:38px}
html.phone .work{flex:1;min-height:0;display:flex;flex-direction:column;align-items:stretch;gap:0}
html.phone .stagewrap{flex:1;min-height:0;position:static;gap:0}
html.phone .viewbar,html.phone .pastebox,html.phone .meta{display:none}
html.phone .stage{flex:1;min-height:120px;padding:0;border-radius:12px 12px 0 0;display:block;position:relative}
html.phone .stage canvas{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);max-height:none;object-fit:contain;background:transparent;box-shadow:none}
html.phone .holdhint{display:block;position:absolute;right:10px;bottom:10px;font:500 11px/1 var(--mono);background:var(--surface);color:var(--muted);border:1px solid var(--rule);padding:6px 8px;border-radius:6px;pointer-events:none}
html.phone .panel{flex:none;border-radius:0 0 14px 14px;border-top:0;display:flex;flex-direction:column}
html.phone .panel .group{display:none;padding:12px 14px;gap:10px;border-top:0;max-height:min(42vh,340px);overflow-y:auto;-webkit-overflow-scrolling:touch}
html.phone .panel .group.open{display:flex}
html.phone .panel .group h2{font-size:16px}
html.phone .panel .group:not(#gLines):not(#gShade) h2{display:none}
html.phone .rows{gap:8px}
html.phone input[type=range]{height:30px}
html.phone .toolnav{order:2;position:static;display:grid;grid-template-columns:repeat(6,1fr);gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));border-bottom:0;border-top:1px solid var(--rule);border-radius:0 0 14px 14px;overflow:visible}
html.phone .toolnav button{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:var(--muted);padding:6px 0;min-height:54px;border-radius:10px;font-size:11px;font-weight:600;min-width:0}
html.phone .toolnav button .ti{display:block;width:22px;height:22px}
html.phone .toolnav button .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
html.phone .toolnav button.on{background:var(--violet-soft);color:var(--violet)}
html.phone .toolnav button:hover{background:transparent;color:var(--muted)}
html.phone .toolnav button.on:hover{background:var(--violet-soft);color:var(--violet)}
.group.off .rows{opacity:.4;pointer-events:none}
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-direction:column;gap:6px}
.row .lab{display:flex;justify-content:space-between;gap:8px}
.row label{font-weight:500}
.row output{font:12px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--violet);margin:0;height:22px}
.hint{margin:0;color:var(--muted);font-size:12.5px}

.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:36px;height:20px;border-radius:999px;background:var(--rule);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked+.sw{background:var(--violet)}
.switch input:checked+.sw::after{transform:translateX(16px)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(10,6,18,.7);z-index:40;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .card{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:min(560px,100%);max-height:100%;overflow:auto}
.ai{background:var(--violet-soft)}
.ai .steps{margin:0;padding-left:18px;color:var(--ink);font-size:13px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px/1 var(--body);border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:9px 12px;border-radius:999px;cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.ai textarea{font:14px/1.4 var(--body);width:100%;min-height:64px;border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.ai .btn{justify-content:center;text-decoration:none}
.ai details summary{cursor:pointer;color:var(--violet);font-weight:600;font-size:13px}
.ai pre{white-space:pre-wrap;font:12px/1.45 var(--mono);background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:10px;margin:8px 0 0;user-select:text;-webkit-user-select:text}
.modal img{background:#fff;max-height:60vh;width:auto;margin:0 auto;display:block}
@media (pointer:coarse){
  .btn{min-height:46px;padding:12px 18px;font-size:15px}
  .seg button{min-height:42px;padding:10px 12px;font-size:14px}
  input[type=range]{height:34px}
  .sw{width:46px;height:26px}.sw::after{width:22px;height:22px}
  .switch input:checked+.sw::after{transform:translateX(20px)}
  .switch{min-height:40px}
  .stage canvas{touch-action:manipulation}
}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
</style>
</head><body>

<div class="app">
  <div class="topbar">
    <div class="opt"><span class="olab"><svg width="16" height="16" style="vertical-align:-3px;margin-right:6px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span data-i="h_lang"></span></span>
      <div class="tseg" id="langSeg" role="group" data-ia="h_lang"><button type="button" data-l="pt"><span class="long">Português</span><span class="short">PT</span></button><button type="button" data-l="es"><span class="long">Español</span><span class="short">ES</span></button><button type="button" data-l="en"><span class="long">English</span><span class="short">EN</span></button></div></div>
    <div class="opt"><span class="olab" data-i="h_screen"></span>
      <div class="tseg" id="modeSeg" role="group" data-ia="h_screen"><button type="button" data-m="tablet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="2" width="18" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg><span>iPad</span></button><button type="button" data-m="phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg><span data-i="m_phone"></span></button></div></div>
  </div>
  <div class="welcome" id="welcome" role="dialog" aria-labelledby="wTitle" hidden>
    <strong id="wTitle" data-i="w_title"></strong>
    <p data-i="w_intro"></p>
    <ul><li id="wLang"></li><li id="wMode"></li></ul>
    <p data-i="w_change"></p>
    <button class="btn primary" type="button" id="wOk" data-i="w_ok"></button>
  </div>
  <header class="top">
    <div>
      <h1>Stencil <span>Lab</span></h1>
      <p class="tag" data-i="tag"></p>
    </div>
    <div class="actions">
      <label class="btn filebtn"><span class="long" data-i="load"></span><span class="short" data-i="load_s"></span><input type="file" id="file" accept="image/*" data-ia="load"></label>
      <button class="btn primary" id="save" type="button"><span class="long" data-i="save"></span><span class="short" data-i="save_s"></span></button>
    </div>
  </header>

  <main class="work">
    <section class="stagewrap">
      <div class="viewbar">
        <div class="seg" id="viewSeg" role="group" data-ia="view_aria"></div>
        <span class="hint" data-i="drag_hint"></span>
      </div>
      <div class="stage" id="stage">
        <canvas id="out" width="10" height="10" data-ia="canvas_aria"></canvas>
        <span class="badge" id="badge" data-i="badge"></span>
        <span class="busy" id="busy" hidden data-i="busy"></span>
        <span class="holdhint" data-i="hold_hint"></span>
      </div>
      <div class="pastebox" id="pastebox" contenteditable="true" role="textbox" data-ia="paste_aria" inputmode="none"></div>
      <p class="meta" id="meta"></p>
    </section>

    <aside class="panel">
      <nav class="toolnav" id="toolnav" data-ia="nav_tools">
        <button type="button" data-g="gStyle"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 18.5 12 15.6 7 18.5l1.4-5.7L4 9l5.8-.7z"/></svg><span class="tl" data-i="h_style"></span></button>
        <button type="button" data-g="gLines"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14 7l3 3"/></svg><span class="tl" data-i="h_lines"></span></button>
        <button type="button" data-g="gShade"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M12 8l4-3M12 12l7-5M12 16l8-5M12 20l6-4"/></svg><span class="tl" data-i="h_shade"></span></button>

const srcCv=document.createElement('canvas'),stCv=document.createElement('canvas'),out=$('#out');

function boxes(sigma){const n=3,wi=Math.sqrt(12*sigma*sigma/n+1);let wl=Math.floor(wi);if(wl%2===0)wl--;const wu=wl+2;
  const m=Math.round((12*sigma*sigma-n*wl*wl-4*n*wl-3*n)/(-4*wl-4));return [0,1,2].map(i=>i<m?wl:wu);}
function boxH(s,d,w,h,r){const ia=1/(2*r+1);for(let y=0;y<h;y++){const o=y*w;let v=(r+1)*s[o];
  for(let j=0;j<r;j++)v+=s[o+Math.min(j,w-1)];
  for(let x=0;x<w;x++){v+=s[o+Math.min(x+r,w-1)]-s[o+Math.max(x-r-1,0)];d[o+x]=v*ia;}}}
function boxV(s,d,w,h,r){const ia=1/(2*r+1);for(let x=0;x<w;x++){let v=(r+1)*s[x];
  for(let j=0;j<r;j++)v+=s[Math.min(j,h-1)*w+x];
  for(let y=0;y<h;y++){v+=s[Math.min(y+r,h-1)*w+x]-s[Math.max(y-r-1,0)*w+x];d[y*w+x]=v*ia;}}}
function blur(src,w,h,sigma){const a=Float32Array.from(src);if(sigma<0.4)return a;const t=new Float32Array(a.length);
  for(const s of boxes(sigma)){const r=(s-1)>>1;if(r<1)continue;boxH(a,t,w,h,r);boxV(t,a,w,h,r);}return a;}

function canny(g,w,h,detail){
  const n=w*h,mag=new Float32Array(n),dir=new Uint8Array(n);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;
    const gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1];
    const gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1];
    mag[i]=Math.sqrt(gx*gx+gy*gy);const ax=Math.abs(gx),ay=Math.abs(gy);
    dir[i]=ay<=ax*0.4142?0:ay>ax*2.4142?2:(gx*gy>0?1:3);}
  const nms=new Float32Array(n);let mx=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,m=mag[i];if(!m)continue;let a,b;
    switch(dir[i]){case 0:a=mag[i-1];b=mag[i+1];break;case 2:a=mag[i-w];b=mag[i+w];break;
      case 1:a=mag[i-w-1];b=mag[i+w+1];break;default:a=mag[i-w+1];b=mag[i+w-1];}
    if(m>=a&&m>=b){nms[i]=m;if(m>mx)mx=m;}}
  const e=new Uint8Array(n);if(!mx)return e;
  const B=2048,hist=new Uint32Array(B);let cnt=0;
  for(let i=0;i<n;i++)if(nms[i]>0){hist[Math.min(B-1,(nms[i]/mx*B)|0)]++;cnt++;}
  let acc=0,p=B-1;const target=cnt*0.98;for(let i=0;i<B;i++){acc+=hist[i];if(acc>=target){p=i;break;}}
  const p98=(p+1)/B*mx,high=p98*(1-0.0088*detail),low=high*0.45;
  const st=new Int32Array(n);let sp=0;
  for(let i=0;i<n;i++)if(nms[i]>=high&&!e[i]){e[i]=1;st[sp++]=i;
    while(sp){const j=st[--sp];for(let dy=-w;dy<=w;dy+=w)for(let dx=-1;dx<=1;dx++){const q=j+dy+dx;
      if(q>0&&q<n&&!e[q]&&nms[q]>=low){e[q]=1;st[sp++]=q;}}}}

function removeSmall(m,w,h,min){
  if(min<2)return m;const n=w*h,seen=new Uint8Array(n),st=new Int32Array(n),comp=new Int32Array(n);

    while(sp){const j=st[--sp];comp[c++]=j;const x=j%w;
      for(let dy=-w;dy<=w;dy+=w)for(let dx=-1;dx<=1;dx++){if((x===0&&dx<0)||(x===w-1&&dx>0))continue;const q=j+dy+dx;
        if(q>=0&&q<n&&m[q]&&!seen[q]){seen[q]=1;st[sp++]=q;}}}
    if(c<min)for(let k=0;k<c;k++)m[comp[k]]=0;}

function dilate(m,w,h,r){

  const o=new Uint8Array(m.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!m[y*w+x])continue;
    for(let k=0;k<offs.length;k+=2){const X=x+offs[k],Y=y+offs[k+1];if(X>=0&&X<w&&Y>=0&&Y<h)o[Y*w+X]=1;}}

function prepare(){
  const key=srcId+'|'+S.res;if(cache.base===key)return;
  const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,sc=S.res/Math.max(sw,sh);
  W=Math.max(1,Math.round(sw*sc));H=Math.max(1,Math.round(sh*sc));K=Math.max(W,H)/1200;
  srcCv.width=W;srcCv.height=H;const x=srcCv.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingQuality='high';x.drawImage(src,0,0,W,H);
  const d=x.getImageData(0,0,W,H).data;base=new Float32Array(W*H);
  for(let i=0,j=0;j<base.length;i+=4,j++)base[j]=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
  cache.base=key;cache.adj=cache.lines=cache.shade='';

function process(){
  prepare();
  const ak=cache.base+`|${S.bright}|${S.contrast}`;
  if(cache.adj!==ak){const c=S.contrast/100,b=S.bright/100;adj=new Float32Array(base.length);
    for(let i=0;i<base.length;i++){const v=(base[i]-0.5)*c+0.5+b;adj[i]=v<0?0:v>1?1:v;}
    cache.adj=ak;cache.lines=cache.shade='';}
  const lk=S.linesOn?ak+`|${S.detail}|${S.lineBlur}|${S.thick}|${S.clean}`:'off';
  if(cache.lines!==lk){
    if(S.linesOn){const g=blur(adj,W,H,S.lineBlur*K);let e=canny(g,W,H,S.detail);
      e=removeSmall(e,W,H,Math.round(S.clean*K));linesM=dilate(e,W,H,(S.thick*K-1)/2);}
    else linesM=null;cache.lines=lk;}
  const sk=S.shadeOn?ak+`|${S.shadeStyle}|${S.tones}|${S.cutoff}|${S.shadeBlur}`:'off';
  if(cache.shade!==sk){shadeR=S.shadeOn?shade():null;cache.shade=sk;}

function shade(){
  const g=blur(adj,W,H,S.shadeBlur*K*1.5),n=S.tones,C=S.cutoff/100,N=W*H;
  if(S.shadeStyle==='dots'){
    const cell=Math.max(5,Math.round(9*K)),dots=[];
    for(let cy=0;cy<H;cy+=cell)for(let cx=0;cx<W;cx+=cell){let s=0,c=0;
      for(let y=cy;y<Math.min(H,cy+cell);y++)for(let x=cx;x<Math.min(W,cx+cell);x++){s+=g[y*W+x];c++;}
      const avg=s/c;if(avg<C){let t=(C-avg)/C;t=Math.ceil(t*n)/n;dots.push(cx+cell/2,cy+cell/2,cell*0.5*Math.sqrt(t)*1.05);}}
    return {dots};
  }
  const L=levels(g,n,C),mask=new Uint8Array(N);
  const sp=Math.max(4,Math.round(7*K)),per=sp*2,hw=Math.max(1,Math.round(K)),big=per*10000;
  if(S.shadeStyle==='outline'){
    const dper=Math.max(6,Math.round(9*K)),don=Math.round(dper*0.62);
    for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,l=L[i];if(!l)continue;
      if((L[i-1]<l||L[i+1]<l||L[i-W]<l||L[i+W]<l)&&((x+y)%dper)<don)mask[i]=1;}
    return {mask:dilate(mask,W,H,Math.max(0.5,0.6*K))};
  }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,l=L[i];if(!l)continue;
    if(S.shadeStyle==='solid'&&l===n){mask[i]=1;continue;}
    if(((x+y)%per)<hw||(l>=2&&((x-y+big)%per)<hw)||(l>=3&&((x+y+sp)%per)<hw))mask[i]=1;}

function levels(g,n,C){const L=new Uint8Array(g.length);
  for(let i=0;i<g.length;i++){let l=0;for(let k=0;k<n;k++)if(g[i]<C*(n-k)/n)l++;L[i]=l;}return L;}
function compose(){

function render(){
  if(!W)return;out.width=W;out.height=H;const x=out.getContext('2d');x.save();
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  if(S.view==='original'||holdOrig){x.drawImage(srcCv,0,0);}
  else{if(S.mirror){x.translate(W,0);x.scale(-1,1);}
    if(S.view==='overlay'){x.globalAlpha=.5;x.drawImage(srcCv,0,0);x.globalAlpha=1;x.globalCompositeOperation='multiply';}
    x.drawImage(stCv,0,0);}
  x.restore();
  const cm=v=>(v/300*2.54).toFixed(1);
  $('#meta').textContent=`${srcName} · ${W} × ${H} px · ${cm(W)} × ${cm(H)} ${t('meta_dpi')}`;
}
let timer=null;
function schedule(){
  if(!src)return;clearTimeout(timer);$('#busy').hidden=false;
  timer=setTimeout(()=>{requestAnimationFrame(()=>{try{process();}catch(err){console.error(err);toast(t('t_procfail'));}
    $('#busy').hidden=true;});},90);
}

/* ---------- Export ---------- */
$('#save').addEventListener('click',async()=>{
  if(!W)return;
  const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  if(S.mirror){x.translate(W,0);x.scale(-1,1);}x.drawImage(stCv,0,0);
  const base=(isSample?'stencil-exemplo':srcName.replace(/\.[^.]+$/,'').replace(/[^\w-]+/g,'-').slice(0,60))||'stencil';
  const filename=`${base}-stencil${S.mirror?'-espelhado':''}.png`;
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(blob&&navigator.canShare){
    const file=new File([blob],filename,{type:'image/png'});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return;}
      catch(e){if(e&&e.name==='AbortError')return;}
    }
  }
  $('#modalImg').src=c.toDataURL('image/png');$('#modal').hidden=false;
});
$('#modalClose').addEventListener('click',()=>$('#modal').hidden=true);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true;});


/* ---------- IA (último recurso) ---------- */
const AI_CHIPS=['escamas','cabelo','rosto','maos','ornamentos','agua','contorno'].map(k=>[k,t('c_'+k),t('ct_'+k)]);
const aiSel=new Set(['escamas','contorno']);
const aiBox=document.getElementById('aiChips');
for(const [k,l] of AI_CHIPS){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=l;b.dataset.k=k;
  b.addEventListener('click',()=>{aiSel.has(k)?aiSel.delete(k):aiSel.add(k);aiSync();});aiBox.appendChild(b);}
function aiPrompt(){
  const parts=[t('pr1'),t('pr2'),t('pr3'),t('pr4')];
  for(const [k,,t] of AI_CHIPS)if(aiSel.has(k))parts.push(t);
  const ex=document.getElementById('aiExtra').value.trim();if(ex)parts.push(ex);
  parts.push(t('pr5'));
  return parts.join('\n');
}
function aiSync(){for(const b of aiBox.children)b.setAttribute('aria-pressed',String(aiSel.has(b.dataset.k)));document.getElementById('aiPrompt').textContent=aiPrompt();}
document.getElementById('aiExtra').addEventListener('input',aiSync);
aiSync();
document.getElementById('aiGo').addEventListener('click',()=>{
  const p=aiPrompt();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(p).then(()=>toast(t('t_copied'),5000)).catch(()=>toast(t('t_copyfail'),6000));}
  else toast(t('t_copymanual'),6000);
});
document.getElementById('aiFile').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  await loadFile(f);applyPreset('fineline');S.clean=10;S.detail=60;syncUI();schedule();
  toast(t('t_aiLoaded'),6000);
});

syncUI();
setSource(sample(),t('badge'),true);
})();
</script>
